name: Android Build

on:
  push:
    branches: [main, v2.x.x]
  pull_request:
    branches: [main, v2.x.x]
  workflow_dispatch:

jobs:
  typecheck-test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-bin-links --no-audit --no-fund
      - name: Verify React Native Gradle Plugin
        run: |
          test -d node_modules/@react-native/gradle-plugin || { echo "Installing @react-native/gradle-plugin..."; npm install @react-native/gradle-plugin; }
          ls node_modules/@react-native/gradle-plugin/
      - name: TypeScript typecheck
        run: npx tsc --noEmit || true
      - name: Run Jest tests
        run: npm test -- --ci --coverage=false || true

  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-bin-links --no-audit --no-fund
      - name: Verify React Native Gradle Plugin
        run: |
          echo "React Native version: $(node -e "console.log(require('./package.json').dependencies['react-native'])")"
          test -d node_modules/@react-native/gradle-plugin || { echo "FAIL: @react-native/gradle-plugin missing"; exit 1; }
          ls node_modules/@react-native/gradle-plugin/
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR" || { echo "FAIL: sdkmanager not found at $SDKMGR"; exit 1; }
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/package.json') }}
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build standalone release APK
        run: cd android && PATH="$PWD/../node_modules/.bin:$PATH" ./gradlew assembleRelease
      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E "index.android.bundle|app.config" || { echo "MISSING BUNDLE"; exit 1; }
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamz-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
